<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background: transparent;
            font-family: 'Arial', sans-serif;
        }
        .scoreboard {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(30,30,60,0.9));
            padding: 20px;
            border-radius: 15px;
            color: white;
            min-width: 300px;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }
        .runs {
            color: #4ade80;
        }
        .wickets {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="scoreboard">
        <div class="score">
            <span class="runs" id="runs">0</span>
            /
            <span class="wickets" id="wickets">0</span>
        </div>
        <div id="overs">Overs: 0.0</div>
        <div id="batsman">Batsman: ---</div>
    </div>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        
        function updateScore() {
            document.getElementById('runs').textContent = params.get('runs') || '0';
            document.getElementById('wickets').textContent = params.get('wickets') || '0';
            document.getElementById('overs').textContent = 'Overs: ' + (params.get('overs') || '0.0');
            document.getElementById('batsman').textContent = 'Batsman: ' + (params.get('batsman') || '---');
        }
        
        updateScore();
        
        // Auto-refresh every 2 seconds
        setInterval(() => {
            location.reload();
        }, 2000);
    </script>
</body>
</html>
