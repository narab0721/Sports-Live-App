name: Node.js Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    # This starts a real Redis server for your tests to use! 🚀
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: server/package.json
flutter_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile
        
      - name: Run Flutter Analyze
        run: flutter analyze
        working-directory: mobile
        
      - name: Install dependencies
        run: npm install
        working-directory: server

      - name: Run Syntax Check (Lint)
        run: node --check server.js
        working-directory: server

    # Next, we would add 'npm test' here once we write test scripts
