name: Sports-Live-App Master CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Verify the Node.js Backend 🛰️
  backend_test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
        working-directory: server
      - name: Syntax Check
        run: node --check server.js
        working-directory: server

  # Job 2: Verify the Flutter Mobile App 📱
  mobile_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
        working-directory: mobile
      - name: Generate Hive Adapters 🛠️
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: mobile
      - name: Analyze Code
        run: flutter analyze
        working-directory: mobile

  # Job 3: Verify the OBS Worker Scripts 🎬
  obs_worker_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
        working-directory: obs_worker
      - name: Syntax Check
        run: node --check worker.js
        working-directory: obs_worker
